name: Tests

# Runs the pytest suite in tests/ on every push and pull request.
#
# The companion py-compat.yml workflow is a dependency-free syntax check across
# every supported Python; this one actually executes the tests, so it installs
# what they need. That is deliberately just two packages: pytest, plus PyQt6 for
# the protected-tag suites (tests/test_tag_atoms.py and
# tests/test_tag_protection_seam.py), which exercise real QTextDocuments. No
# other runtime dependency is imported by any test — installing the full
# requirements.txt (PyQt6-WebEngine and friends) would add minutes for nothing.
#
# Qt runs headless via QT_QPA_PLATFORM=offscreen (set in tests/conftest.py), but
# it still needs a handful of system libraries present to import at all. Without
# them PyQt6 raises ImportError, pytest.importorskip quietly skips those suites,
# and the tag tests would silently stop running — so the apt step matters.

on:
  push:
  pull_request:

jobs:
  pytest:
    name: pytest on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported version and the one development happens on. The
        # middle version is covered by the byte-compile matrix in py-compat.yml.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install test dependencies
        run: python -m pip install --quiet --upgrade pip pytest PyQt6

      - name: Verify PyQt6 imports (so Qt suites are not silently skipped)
        run: python -c "import PyQt6.QtWidgets; print('PyQt6 OK')"
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Run tests
        run: python -m pytest tests/ -q
