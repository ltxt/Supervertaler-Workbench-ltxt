name: Tests

# Runs the pytest suite in tests/ on every push and pull request.
#
# The companion py-compat.yml workflow is a dependency-free syntax check across
# every supported Python; this one actually executes the tests, so it installs
# what they need. That is deliberately three packages, not the full
# requirements.txt (PyQt6-WebEngine and friends would add minutes for nothing):
#
#   pytest
#   PyQt6        — the protected-tag suites exercise real QTextDocuments
#   python-docx  — the DOCX handler suites and the corpus round trip
#
# Every one of those is a hard requirement, not a nicety, because each suite
# guards itself with pytest.importorskip: a missing package turns into a *skip*,
# not a failure, so the job would stay green while testing nothing. The same
# applies to Qt's system libraries — without them PyQt6 raises ImportError and
# the tag suites quietly vanish. Hence both the apt step and the explicit import
# checks below.

on:
  push:
  pull_request:

jobs:
  pytest:
    name: pytest on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported version and the one development happens on. The
        # middle version is covered by the byte-compile matrix in py-compat.yml.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install test dependencies
        run: python -m pip install --quiet --upgrade pip pytest PyQt6 python-docx

      - name: Verify optional imports (so no suite is silently skipped)
        run: |
          python -c "import PyQt6.QtWidgets; print('PyQt6 OK')"
          python -c "import docx; print('python-docx', docx.__version__)"
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Run tests
        run: python -m pytest tests/ -q -m "not gui"

  roundtrip:
    # Produces the target documents — real DOCX / SDLXLIFF / MQXLIFF files with
    # every segment translated — and uploads them as an artifact. That is this
    # job's reason to exist: no test can tell you whether Word, Trados Studio or
    # memoQ will *accept* our output, so a reviewer has to open it, and this makes
    # the files one download away for any commit.
    #
    # The round-trip suite itself also runs in the pytest job above, on both
    # Python versions. It is repeated here as a precondition, so a broken export
    # fails before its output is published as something worth looking at.
    name: Target files (document round trip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet --upgrade pip pytest python-docx

      - name: Verify python-docx imports (so the suite is not silently skipped)
        # The suite calls importorskip("docx"), which turns a missing dependency
        # into a skip — that would leave this job green while testing nothing.
        run: python -c "import docx; print('python-docx', docx.__version__)"

      - name: Run the round trip
        run: python -m pytest tests/test_e2e_roundtrip.py -m e2e

      - name: Generate the target files
        # Not asserted on — this proves the tool a reviewer would run still works,
        # and leaves the documents as an artifact to open in Word/Trados/memoQ.
        run: python tools/generate_target_files.py --out target_files

      - name: Upload the target files
        uses: actions/upload-artifact@v4
        with:
          name: target-files
          path: target_files/
          if-no-files-found: error

  grid-smoke:
    # Builds the real application window headlessly and asserts what the grid
    # rendered. Separate from the job above because it needs a few of the
    # application's own runtime dependencies, and because it is the only test
    # that can catch display-layer bugs — two such bugs shipped past the unit
    # tests: the Partial view discarding its configured detail level, and tag
    # atoms being built out of {1} placeholders instead of the real tags.
    name: Grid smoke test (headless GUI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install dependencies
        # Only what constructing the main window actually imports — not the full
        # requirements.txt, which would add minutes for nothing.
        run: python -m pip install --quiet --upgrade pip pytest PyQt6 pyperclip pillow

      - name: Run the grid smoke test
        run: python -m pytest tests/test_grid_smoke.py -q -m gui
        env:
          QT_QPA_PLATFORM: offscreen
