name: Tests

# Runs the pytest suite in tests/ on every push and pull request.
#
# The companion py-compat.yml workflow is a dependency-free syntax check across
# every supported Python; this one actually executes the tests, so it installs
# what they need. That is deliberately just two packages: pytest, plus PyQt6 for
# the protected-tag suites (tests/test_tag_atoms.py and
# tests/test_tag_protection_seam.py), which exercise real QTextDocuments. No
# other runtime dependency is imported by any test — installing the full
# requirements.txt (PyQt6-WebEngine and friends) would add minutes for nothing.
#
# Qt runs headless via QT_QPA_PLATFORM=offscreen (set in tests/conftest.py), but
# it still needs a handful of system libraries present to import at all. Without
# them PyQt6 raises ImportError, pytest.importorskip quietly skips those suites,
# and the tag tests would silently stop running — so the apt step matters.

on:
  push:
  pull_request:

jobs:
  pytest:
    name: pytest on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported version and the one development happens on. The
        # middle version is covered by the byte-compile matrix in py-compat.yml.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install test dependencies
        run: python -m pip install --quiet --upgrade pip pytest PyQt6

      - name: Verify PyQt6 imports (so Qt suites are not silently skipped)
        run: python -c "import PyQt6.QtWidgets; print('PyQt6 OK')"
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Run tests
        run: python -m pytest tests/ -q -m "not gui"

  roundtrip:
    # Takes the real Trados / memoQ / Phrase / Word documents in
    # tests/fixtures/corpus through import → translate → export → re-import and
    # diffs a normalised snapshot against tests/golden/. This is the only job
    # that exercises the format handlers end to end; it is where the DOCX
    # exporter's paragraph-mapping bug was found, and where a change in what the
    # tag parser recognises in real documents shows up as a golden diff.
    #
    # Separate from the pytest job because it needs python-docx, which no other
    # test imports — installing it there would slow both matrix legs for one
    # suite. Runs on one Python version: the code under test is format handling,
    # not anything version-sensitive.
    name: Document round trip (golden snapshots)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet --upgrade pip pytest python-docx

      - name: Verify python-docx imports (so the suite is not silently skipped)
        # The suite calls importorskip("docx"), which turns a missing dependency
        # into a skip — that would leave this job green while testing nothing.
        run: python -c "import docx; print('python-docx', docx.__version__)"

      - name: Run the round trip
        run: python -m pytest tests/test_e2e_roundtrip.py -m e2e

      - name: Generate the target files
        # Not asserted on — this proves the tool a reviewer would run still works,
        # and leaves the documents as an artifact to open in Word/Trados/memoQ.
        run: python tools/generate_target_files.py --out target_files

      - name: Upload the target files
        uses: actions/upload-artifact@v4
        with:
          name: target-files
          path: target_files/
          if-no-files-found: error

  grid-smoke:
    # Builds the real application window headlessly and asserts what the grid
    # rendered. Separate from the job above because it needs a few of the
    # application's own runtime dependencies, and because it is the only test
    # that can catch display-layer bugs — two such bugs shipped past the unit
    # tests: the Partial view discarding its configured detail level, and tag
    # atoms being built out of {1} placeholders instead of the real tags.
    name: Grid smoke test (headless GUI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install dependencies
        # Only what constructing the main window actually imports — not the full
        # requirements.txt, which would add minutes for nothing.
        run: python -m pip install --quiet --upgrade pip pytest PyQt6 pyperclip pillow

      - name: Run the grid smoke test
        run: python -m pytest tests/test_grid_smoke.py -q -m gui
        env:
          QT_QPA_PLATFORM: offscreen
